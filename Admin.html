<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель — Пицца Мигом</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f8f7f2; 
            margin: 0; 
            padding: 40px 20px; 
        }
        .admin-container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        h1 { 
            color: #1a1a1a; 
            text-align: center; 
            margin-top: 0;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
        }
        th, td { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 1px solid #eee; 
        }
        th { 
            background-color: #ffca28; 
            color: #000; 
            font-weight: 600; 
        }
        tr:hover { 
            background-color: #fdfbf7; 
        }
        .btn-delete { 
            background: #e74c3c; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-delete:hover { 
            background: #c0392b; 
        }
        .loading { 
            text-align: center; 
            padding: 30px; 
            font-size: 18px; 
            color: #555; 
        }
        .status-select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }
    </style>
</head>
<body>
    <!-- Форма авторизации -->
    <div id="loginOverlay" style="position: fixed; inset: 0; background: #f8f7f2; display: flex; align-items: center; justify-content: center; z-index: 10000;">
        <div style="background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 300px; text-align: center;">
            <h2 style="margin-top: 0; margin-bottom: 20px;">Вход в систему</h2>
            <input type="email" id="adminUser" placeholder="Email администратора" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: 'Poppins', sans-serif;">
            <input type="password" id="adminPass" placeholder="Пароль" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: 'Poppins', sans-serif;">
            <button id="loginBtn" style="width: 100%; background: #ffca28; border: none; padding: 12px; border-radius: 5px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Poppins', sans-serif;">Войти</button>
            <p id="loginError" style="color: #e74c3c; margin-top: 15px; display: none; font-size: 14px;">Неверный логин или пароль</p>
        </div>
    </div>

    <!-- Основной интерфейс админки (скрыт по умолчанию) -->
    <div class="admin-container" id="app" style="display: none;">
        <h1>Управление заказами</h1>
        <div id="loading" class="loading">Загрузка заказов...</div>
        <table id="ordersTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Телефон</th>
                    <th>Адрес / Способ получения</th>
                    <th>Заказ</th>
                    <th>Сумма (₽)</th>
                    <th>Статус</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="ordersBody">
               
            </tbody>
        </table>
    </div>

    <script>
        // ЛОГИКА АВТОРИЗАЦИИ
        const loginOverlay = document.getElementById('loginOverlay');
        const appContainer = document.getElementById('app');
        const loginBtn = document.getElementById('loginBtn');
        const adminUser = document.getElementById('adminUser');
        const adminPass = document.getElementById('adminPass');
        const loginError = document.getElementById('loginError');

        // Данные Supabase 
        const SUPABASE_URL = 'https://allymvkgifonzmtszafk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yx3r4nfUMo545nof5ytVJA_maYWxW2a';

        const headers = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        };

        async function attemptLogin() {
            const email = adminUser.value.trim();
            const pass = adminPass.value;

            loginBtn.textContent = 'Загрузка...';
            loginBtn.disabled = true;
            loginError.style.display = 'none';

            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                    body: JSON.stringify({ email: email, password: pass })
                });

                if (!response.ok) throw new Error('Неверный Email или пароль');

                const data = await response.json();
                // Подменяем анонимный токен на токен авторизованного администратора
                headers['Authorization'] = `Bearer ${data.access_token}`;

                loginOverlay.style.display = 'none';
                appContainer.style.display = 'block';
                fetchOrders(); 
            } catch (error) {
                loginError.textContent = error.message;
                loginError.style.display = 'block';
            } finally {
                loginBtn.textContent = 'Войти';
                loginBtn.disabled = false;
            }
        }

        loginBtn.addEventListener('click', attemptLogin);
        adminPass.addEventListener('keypress', (e) => { if (e.key === 'Enter') attemptLogin(); });

        // Функция получения заказов
        async function fetchOrders() {
            try {
            
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=id.desc`, {
                    headers: headers
                });
                if (!response.ok) throw new Error('Ошибка загрузки данных с сервера');
                
                const orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                console.error(error);
                alert("Не удалось загрузить заказы. Проверьте подключение к базе данных.");
            }
        }

        // Отрисовка таблицы
        function renderOrders(orders) {
            const tbody = document.getElementById('ordersBody');
            const loading = document.getElementById('loading');
            const table = document.getElementById('ordersTable');

            tbody.innerHTML = '';
            
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 30px; color: #555;">Заказов пока нет.</td></tr>';
            } else {
                orders.forEach(order => {
                    const currentStatus = order.status || 'Новый';
                    const statusOptions = ['Новый', 'Готовится', 'В пути', 'Выполнен', 'Отменен'];
                    const statusColors = { 'Новый': '#e74c3c', 'Готовится': '#f39c12', 'В пути': '#3498db', 'Выполнен': '#2ecc71', 'Отменен': '#95a5a6' };

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${order.id || '-'}</td>
                        <td><strong>${order.client_number}</strong></td>
                        <td>${order.address}</td>
                        <td>${order.order_content}</td>
                        <td><strong>${order.total_price} ₽</strong></td>
                        <td>
                            <select class="status-select" style="color: #fff; background-color: ${statusColors[currentStatus] || '#333'}" onchange="updateOrderStatus(${order.id}, this)">
                                ${statusOptions.map(s => `<option value="${s}" style="color:#000; background:#fff;" ${currentStatus === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </td>
                        <td>
                            <button class="btn-delete" onclick="deleteOrder(${order.id})">Удалить</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            loading.style.display = 'none';
            table.style.display = 'table';
        }

        // Функция удаления (отмены) заказа
        async function deleteOrder(id) {
            if (!id) {
                alert('Ошибка: ID заказа не найден.');
                return;
            }
            
            if (!confirm(`Вы действительно хотите отменить заказ #${id}?\nЭто действие нельзя будет отменить.`)) {
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: headers
                });

                if (response.ok) {
                    alert(`Заказ #${id} успешно отменен.`);
                    fetchOrders(); // Перезагружаем список
                } else {
                    throw new Error('Ошибка при удалении');
                }
            } catch (error) {
                console.error(error);
                alert("Не удалось отменить заказ. Попробуйте еще раз.");
            }
        }

        // Функция обновления статуса заказа
        async function updateOrderStatus(id, selectElement) {
            const newStatus = selectElement.value;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: Object.assign({}, headers, { 'Prefer': 'return=minimal' }),
                    body: JSON.stringify({ status: newStatus })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.message || errData.details || 'Ошибка сервера Supabase');
                }
                
                const statusColors = { 'Новый': '#e74c3c', 'Готовится': '#f39c12', 'В пути': '#3498db', 'Выполнен': '#2ecc71', 'Отменен': '#95a5a6' };
                selectElement.style.backgroundColor = statusColors[newStatus] || '#333';
            } catch (error) {
                console.error(error);
                alert(`Не удалось обновить статус:\n${error.message}`);
                fetchOrders(); // возвращаем старый статус
            }
        }
    </script>
</body>
</html>
