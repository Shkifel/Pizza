<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель — Пицца Мигом</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f8f7f2; 
            margin: 0; 
            padding: 40px 20px; 
        }
        .admin-container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        h1 { 
            color: #1a1a1a; 
            text-align: center; 
            margin-top: 0;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
        }
        th, td { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 1px solid #eee; 
        }
        th { 
            background-color: #ffca28; 
            color: #000; 
            font-weight: 600; 
        }
        tr:hover { 
            background-color: #fdfbf7; 
        }
        .btn-delete { 
            background: #e74c3c; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-delete:hover { 
            background: #c0392b; 
        }
        .loading { 
            text-align: center; 
            padding: 30px; 
            font-size: 18px; 
            color: #555; 
        }
    </style>
</head>
<body>
    <div class="admin-container" id="app">
        <h1>Управление заказами</h1>
        <div id="loading" class="loading">Загрузка заказов...</div>
        <table id="ordersTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Телефон</th>
                    <th>Адрес / Способ получения</th>
                    <th>Заказ</th>
                    <th>Сумма (₽)</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="ordersBody">
               
            </tbody>
        </table>
    </div>

    <script>
        // ПРОСТАЯ ЗАЩИТА ПАРОЛЕМ ('admin123'пароль)
        const password = prompt("Введите пароль администратора:");
        if (password !== "admin123") {
            document.body.innerHTML = "<h2 style='text-align:center; color:#e74c3c; margin-top:100px;'>Доступ запрещен. Неверный пароль.</h2>";
            throw new Error("Access denied");
        }

        // Данные Supabase 
        const SUPABASE_URL = 'https://allymvkgifonzmtszafk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yx3r4nfUMo545nof5ytVJA_maYWxW2a';

        const headers = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        };

        // Функция получения заказов
        async function fetchOrders() {
            try {
            
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=id.desc`, {
                    headers: headers
                });
                if (!response.ok) throw new Error('Ошибка загрузки данных с сервера');
                
                const orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                console.error(error);
                alert("Не удалось загрузить заказы. Проверьте подключение к базе данных.");
            }
        }

        // Отрисовка таблицы
        function renderOrders(orders) {
            const tbody = document.getElementById('ordersBody');
            const loading = document.getElementById('loading');
            const table = document.getElementById('ordersTable');

            tbody.innerHTML = '';
            
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 30px; color: #555;">Заказов пока нет.</td></tr>';
            } else {
                orders.forEach(order => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${order.id || '-'}</td>
                        <td><strong>${order.client_number}</strong></td>
                        <td>${order.address}</td>
                        <td>${order.order_content}</td>
                        <td><strong>${order.total_price} ₽</strong></td>
                        <td>
                            <button class="btn-delete" onclick="deleteOrder(${order.id})">Отменить</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            loading.style.display = 'none';
            table.style.display = 'table';
        }

        // Функция удаления (отмены) заказа
        async function deleteOrder(id) {
            if (!id) {
                alert('Ошибка: ID заказа не найден.');
                return;
            }
            
            if (!confirm(`Вы действительно хотите отменить заказ #${id}?\nЭто действие нельзя будет отменить.`)) {
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: headers
                });

                if (response.ok) {
                    alert(`Заказ #${id} успешно отменен.`);
                    fetchOrders(); // Перезагружаем список
                } else {
                    throw new Error('Ошибка при удалении');
                }
            } catch (error) {
                console.error(error);
                alert("Не удалось отменить заказ. Попробуйте еще раз.");
            }
        }

        // Запуска загрузки сразу после входа
        fetchOrders();
    </script>
</body>
</html>
